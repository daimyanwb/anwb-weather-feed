name: Update Amsterdam weather feed

on:
  workflow_dispatch:

  schedule:
    # Iedere dag om 07:00 UTC
    # In Nederland is dat 08:00 wintertijd of 09:00 zomertijd
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository openen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Benodigde pakketten installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ECMWF weather feed maken
        run: |
          python weather.py

      - name: Tijdelijk GRIB2-bestand verwijderen
        run: |
          rm -f amsterdam_weather.grib2

      - name: CSV opslaan in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add weather_feed_amsterdam.csv

          if git diff --cached --quiet; then
            echo "Geen wijzigingen in de weather feed."
          else
            git commit -m "Update Amsterdam weather feed"
            git push
          fi
